{% extends "base.html" %}

{% block title %}ebooks — Upload PDF{% endblock %}

{% block content %}
<div class="space-y-8">
    <div>
        <h1 class="text-2xl font-bold mb-1">Upload a PDF</h1>
        <p class="text-gray-500 text-sm">Convert your PDF to audio chunks using text-to-speech.</p>
    </div>

    <!-- Upload Form -->
    <div class="bg-white rounded-lg border border-gray-200 p-6">
        <form
            x-data="uploadForm()"
            @submit.prevent="submit()"
        >
            <!-- Voice Selector -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Voice</label>
                <div class="flex items-center gap-2">
                    <select
                        x-model="voice"
                        class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                    >
                        <template x-for="v in voices" :key="v.filename">
                            <option :value="v.name" x-text="v.name"></option>
                        </template>
                    </select>
                    <button
                        type="button"
                        @click="sampleVoice()"
                        :disabled="!voice || sampling"
                        class="px-3 py-1.5 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-md transition-colors"
                    >
                        <template x-if="sampling">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </template>
                        <template x-if="!sampling">Sample</template>
                    </button>
                </div>
            </div>

            <!-- Source Toggle -->
            <div class="mb-4 flex gap-2">
                <button
                    type="button"
                    @click="sourceMode = 'file'"
                    :class="sourceMode === 'file' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                    class="px-4 py-2 text-sm font-medium rounded-md transition-colors"
                >
                    Upload File
                </button>
                <button
                    type="button"
                    @click="sourceMode = 'url'"
                    :class="sourceMode === 'url' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                    class="px-4 py-2 text-sm font-medium rounded-md transition-colors"
                >
                    From URL
                </button>
            </div>

            <!-- File Drop Zone (file mode) -->
            <template x-if="sourceMode === 'file'">
            <div
                @dragover.prevent="isDragging = true"
                @dragleave.prevent="isDragging = false"
                @drop.prevent="isDragging = false; handleDrop($event)"
                :class="{'border-indigo-500 bg-indigo-50': isDragging, 'border-gray-300': !isDragging}"
                class="border-2 border-dashed rounded-lg p-8 text-center cursor-pointer transition-colors"
                @click="$refs.fileInput.click()"
            >
                <input
                    type="file"
                    accept=".pdf"
                    x-ref="fileInput"
                    @change="handleFileSelect($event)"
                    class="hidden"
                >
                <template x-if="!file">
                    <div>
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                        </svg>
                        <p class="mt-2 text-sm text-gray-600">
                            <span class="font-medium text-indigo-600">Click to upload</span> or drag and drop
                        </p>
                        <p class="text-xs text-gray-500 mt-1">PDF files only (max 25MB)</p>
                    </div>
                </template>
                <template x-if="file">
                    <div class="flex items-center justify-center gap-3">
                        <svg class="h-8 w-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <div>
                            <p class="text-sm font-medium text-gray-900" x-text="file.name"></p>
                            <p class="text-xs text-gray-500" x-text="formatSize(file.size)"></p>
                        </div>
                        <button
                            type="button"
                            @click.stop="clearFile()"
                            class="text-gray-400 hover:text-gray-600 ml-2"
                        >
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </template>
            </div>
            </template>

            <!-- URL Input (url mode) -->
            <template x-if="sourceMode === 'url'">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">PDF URL</label>
                    <input
                        type="url"
                        x-model="pdfUrl"
                        placeholder="https://example.com/book.pdf"
                        class="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border"
                    >
                    <p class="text-xs text-gray-500 mt-1">Enter a direct URL to a PDF file</p>
                </div>
            </template>

            <!-- Submit Button -->
            <div class="mt-4">
                <button
                    type="submit"
                    :disabled="!canSubmit || uploading"
                    class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                >
                    <template x-if="uploading">
                        <span class="flex items-center gap-2">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                            Uploading...
                        </span>
                    </template>
                    <template x-if="!uploading">
                        Convert to Audio
                    </template>
                </button>
            </div>

            <!-- Result Message -->
            <template x-if="message">
                <div
                    x-show="message"
                    x-transition
                    :class="message.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-green-50 text-green-800 border-green-200'"
                    class="mt-4 rounded-md border p-3 text-sm"
                >
                    <p x-text="message.text"></p>
                    <template x-if="message.jobId">
                        <a :href="'/jobs/' + message.jobId" class="font-medium underline mt-1 inline-block">View job</a>
                    </template>
                </div>
            </template>
        </form>
    </div>

    <!-- Job List -->
    <div>
        <h2 class="text-lg font-semibold mb-3">Recent Jobs</h2>
        <div
            hx-get="/jobs/list-all"
            hx-trigger="load, every 5s"
            hx-swap="innerHTML"
            hx-target="#job-list"
        >
            <div id="job-list" class="space-y-2">
                <p class="text-sm text-gray-500 py-4">Loading jobs...</p>
            </div>
        </div>
    </div>
</div>

<script>
function uploadForm() {
    return {
        file: null,
        pdfUrl: '',
        voice: '',
        voices: [],
        sourceMode: 'file',
        isDragging: false,
        uploading: false,
        sampling: false,
        message: null,

        get canSubmit() {
            if (this.sourceMode === 'file') return !!this.file;
            return !!this.pdfUrl;
        },

        init() {
            this.loadVoices();
        },

        loadVoices() {
            fetch('/api/voices')
                .then(r => r.json())
                .then(data => {
                    this.voices = data;
                    // Pre-select first voice (first built-in)
                    if (data.length && !this.voice) {
                        this.voice = data[0].name;
                    }
                })
                .catch(() => {});
        },

        async sampleVoice() {
            if (!this.voice || this.sampling) return;
            this.sampling = true;
            try {
                const audio = new Audio(`/api/voices/${this.voice}/sample`);
                await audio.play();
            } catch (err) {
                console.error('Failed to play voice sample:', err);
            } finally {
                this.sampling = false;
            }
        },

        handleFileSelect(event) {
            const input = event.target;
            if (input.files && input.files.length > 0) {
                this.file = input.files[0];
            }
        },

        handleDrop(event) {
            const files = event.dataTransfer.files;
            if (files && files.length > 0) {
                this.file = files[0];
            }
        },

        clearFile() {
            this.file = null;
            this.$refs.fileInput.value = '';
        },

        formatSize(bytes) {
            if (!bytes) return '';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            let size = bytes;
            while (size >= 1024 && i < units.length - 1) {
                size /= 1024;
                i++;
            }
            return size.toFixed(1) + ' ' + units[i];
        },

        async submit() {
            if (!this.canSubmit) return;
            this.uploading = true;
            this.message = null;

            const formData = new FormData();
            if (this.voice) {
                formData.append('voice', this.voice);
            }

            if (this.sourceMode === 'file') {
                formData.append('file', this.file);
            } else {
                formData.append('url', this.pdfUrl);
            }

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({ detail: 'Upload failed' }));
                    this.message = { type: 'error', text: error.detail || 'Upload failed' };
                    return;
                }

                const data = await response.json();
                this.message = {
                    type: 'success',
                    text: `Job created: ${data.book_name}`,
                    jobId: data.job_id,
                };
                this.clearFile();
                this.pdfUrl = '';

                // Force job list refresh
                const jobList = document.getElementById('job-list');
                if (jobList) {
                    fetch('/jobs/list-all')
                        .then(r => r.text())
                        .then(html => { jobList.innerHTML = html; });
                }
            } catch (err) {
                this.message = { type: 'error', text: 'Network error. Please try again.' };
            } finally {
                this.uploading = false;
            }
        },
    };
}
</script>
{% endblock %}
